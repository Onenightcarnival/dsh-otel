# Tag-triggered release. The tag is the single source of truth for the
# version: the build stamps package.json with the tag's version before packing,
# and a follow-up job writes that version back to package.json, package-lock.json
# and the README's install command on the default branch. Push a `vX.Y.Z` tag
# (GitHub Desktop: right-click a commit, Create Tag, then Push) and nothing else
# needs editing by hand.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Stamp package.json with the tag version
        run: node scripts/set-version.mjs "${GITHUB_REF_NAME#v}"

      - name: Install locked dependencies
        run: npm ci

      - name: Build bundles
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Pack offline tarball
        run: |
          npm pack
          sha256sum dsh-otel-*.tgz | tee SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dsh-otel-*.tgz

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dsh-otel-*.tgz
            SHA256SUMS
          generate_release_notes: true

  sync-version:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Write the released version to package.json and README
        run: |
          node scripts/set-version.mjs "${GITHUB_REF_NAME#v}"
          node scripts/sync-readme.mjs "${GITHUB_REF_NAME#v}"

      - name: Commit if anything changed
        run: |
          if git diff --quiet -- package.json package-lock.json README.md; then
            echo "default branch already at $GITHUB_REF_NAME"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json README.md
          git commit -m "chore: sync version to $GITHUB_REF_NAME [skip ci]"
          git push origin HEAD:${{ github.event.repository.default_branch }}
